<style>

/* ═══════════════════════════════════════
   TOKENS
═══════════════════════════════════════ */
:root {
  --bg:     #020209;
  --nav-bg: rgba(2,2,9,.92);
  --card:   rgba(255,255,255,.04);
  --card-h: rgba(255,255,255,.08);
  --brd:    rgba(0,245,255,.15);
  --brd2:   rgba(255,255,255,.08);
  --t:      #e2e8f0;
  --t2:     #94a3b8;
  --mu:     #8b97ab;
  --c:      #00f5ff;
  --v:      #7c3aed;
  --p:      #ff0080;
  --g:      #f59e0b;
  --wash:   transparent;
  --orb-o:  1; --grid-o:1; --scan-o:1; --cv-o:1; --deco-o:1;
}
body.light {
  --bg:     #f5f7ff;
  --nav-bg: rgba(255,255,255,.95);
  --card:   rgba(255,255,255,.9);
  --card-h: rgba(240,244,255,.95);
  --brd:    rgba(109,40,217,.2);
  --brd2:   rgba(0,0,0,.08);
  --t:      #0f172a; --t2:#334155; --mu:#5b6779;
  --c:      #0284c7; --v:#6d28d9; --p:#db2777; --g:#d97706;
  --wash:   rgba(245,247,255,.92);
  --orb-o:  .35; --grid-o:0; --scan-o:0; --cv-o:1; --deco-o:0;
}

html{scroll-behavior:smooth;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--t);overflow-x:hidden;padding-bottom:50px;transition:background .4s,color .4s;}

/* ═══════════════════════════════════════
   BACKGROUND
═══════════════════════════════════════ */
.bg-photo{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:url('https://images.unsplash.com/photo-1512446816042-444d641267d4?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
  filter:brightness(.12) saturate(2) hue-rotate(215deg);
  animation:bgDrift 38s ease-in-out infinite alternate;transition:filter .6s;}
body.light .bg-photo{filter:brightness(.25) saturate(.2) hue-rotate(200deg);}
@keyframes bgDrift{from{transform:scale(1.04);}to{transform:scale(1.09) translateX(-20px);}}
/* Orbs — z-index:1, BELOW the wash */
.bg-orbs{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 700px 500px at 8% 5%,rgba(124,58,237,.28) 0%,transparent 62%),
    radial-gradient(ellipse 600px 480px at 94% 88%,rgba(0,245,255,.16) 0%,transparent 58%),
    radial-gradient(ellipse 500px 420px at 50% 96%,rgba(255,0,128,.10) 0%,transparent 55%);
  opacity:var(--orb-o);transition:opacity .5s;}
/* Wash — z-index:2, ABOVE orbs so it covers them in light mode */
.bg-wash{position:fixed;inset:0;z-index:2;pointer-events:none;background:var(--wash);transition:background .5s;}
.bg-grid{position:fixed;inset:0;z-index:3;pointer-events:none;
  background-image:linear-gradient(rgba(0,245,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,.022) 1px,transparent 1px);
  background-size:62px 62px;animation:gridMove 24s linear infinite;opacity:var(--grid-o);transition:opacity .5s;}
@keyframes gridMove{to{background-position:62px 62px;}}
.bg-scan{position:fixed;inset:0;z-index:4;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.035) 2px,rgba(0,0,0,.035) 4px);
  opacity:var(--scan-o);transition:opacity .5s;}
#cv{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:var(--cv-o);transition:opacity .5s;}

/* Continuous rings — dark only */
.ring{position:fixed;border-radius:50%;pointer-events:none;z-index:6;transition:opacity .5s;}
body.light .ring{opacity:0;}
.ring-1{width:600px;height:600px;top:-200px;left:-200px;border:1px solid rgba(124,58,237,.07);animation:ringLoop1 10s ease-in-out infinite;}
.ring-2{width:400px;height:400px;bottom:-140px;right:-140px;border:1px solid rgba(0,245,255,.06);animation:ringLoop2 13s ease-in-out infinite;}
@keyframes ringLoop1{0%{transform:scale(.7);opacity:0;}20%{opacity:.8;}60%{opacity:.4;}85%{transform:scale(1.35);opacity:0;}86%{transform:scale(.7);}100%{transform:scale(.7);opacity:0;}}
@keyframes ringLoop2{0%{transform:scale(.75);opacity:0;}25%{opacity:.6;}65%{opacity:.3;}88%{transform:scale(1.4);opacity:0;}89%{transform:scale(.75);}100%{transform:scale(.75);opacity:0;}}

/* ═══════════════════════════════════════
   SIDE DECORATIONS
═══════════════════════════════════════ */
.side{position:fixed;top:50%;transform:translateY(-50%);z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:var(--deco-o);transition:opacity .5s;}
.side.l{left:10px;}.side.r{right:10px;}
.sline{width:1px;background:linear-gradient(180deg,transparent,var(--c),transparent);animation:slinePulse 3s ease-in-out infinite;}
.sline:nth-child(1){height:52px;}.sline:nth-child(3){height:34px;animation-delay:.55s;}.sline:nth-child(5){height:68px;animation-delay:1.1s;}.sline:nth-child(7){height:40px;animation-delay:1.65s;}
@keyframes slinePulse{0%,100%{opacity:.15;}50%{opacity:.85;}}
.sdot{width:5px;height:5px;border-radius:50%;animation:sdotPulse 2.8s ease-in-out infinite;}
.sdot.c{background:var(--c);}.sdot.v{background:var(--v);animation-delay:.75s;}.sdot.p{background:var(--p);animation-delay:1.5s;}
@keyframes sdotPulse{0%,100%{opacity:.15;transform:scale(1);}50%{opacity:1;transform:scale(2.2);}}
.corner{position:fixed;width:22px;height:22px;z-index:6;pointer-events:none;animation:cornerBlink 4s ease-in-out infinite;opacity:var(--deco-o);transition:opacity .5s;}
.corner.tl{top:72px;left:9px;border-top:1.5px solid var(--c);border-left:1.5px solid var(--c);}
.corner.tr{top:72px;right:9px;border-top:1.5px solid var(--c);border-right:1.5px solid var(--c);animation-delay:.4s;}
.corner.bl{bottom:22px;left:9px;border-bottom:1.5px solid var(--v);border-left:1.5px solid var(--v);animation-delay:.8s;}
.corner.br{bottom:22px;right:9px;border-bottom:1.5px solid var(--v);border-right:1.5px solid var(--v);animation-delay:1.2s;}
@keyframes cornerBlink{0%,100%{opacity:.18;}50%{opacity:.6;}}

/* ═══════════════════════════════════════
   NAV
═══════════════════════════════════════ */
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 5%;height:66px;background:var(--nav-bg);backdrop-filter:blur(28px);border-bottom:1px solid var(--brd);transition:background .4s,border-color .4s,box-shadow .4s;}
body.light nav{box-shadow:0 1px 0 rgba(0,0,0,.08),0 4px 20px rgba(0,0,0,.05);border-bottom-color:rgba(0,0,0,.08);}
.logo{font-family:'Orbitron',monospace;font-size:1.3rem;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,var(--c),var(--v));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;flex-shrink:0;animation:logoGlow 5s ease-in-out infinite;}
@keyframes logoGlow{0%,100%{filter:brightness(1);}50%{filter:brightness(1.2) drop-shadow(0 0 10px rgba(0,245,255,.4));}}
.logo:hover{filter:brightness(1.3) drop-shadow(0 0 14px rgba(0,245,255,.5)) !important;}
body.light .logo{background:linear-gradient(90deg,var(--v),var(--c));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-links{display:flex;align-items:center;gap:2.5rem;}
.nav-links a{color:var(--mu);text-decoration:none;font-family:'Orbitron',monospace;font-size:.75rem;letter-spacing:2px;padding:.3rem 0;position:relative;transition:color .25s;}
.nav-links a::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1.5px;background:linear-gradient(90deg,var(--c),var(--v));transform:scaleX(0);transform-origin:left;transition:transform .3s cubic-bezier(.4,0,.2,1);}
.nav-links a:hover{color:var(--t);}.nav-links a:hover::after{transform:scaleX(1);}
.nav-links a.cur{color:var(--c);}.nav-links a.cur::after{transform:scaleX(1);}
body.light .nav-links a.cur{color:var(--v);}
body.light .nav-links a.cur::after{background:linear-gradient(90deg,var(--v),var(--c));}
.btn-theme{display:flex;align-items:center;gap:6px;padding:7px 16px;border:1px solid var(--brd);border-radius:4px;background:var(--card);color:var(--t);font-family:'Orbitron',monospace;font-size:.65rem;letter-spacing:1.5px;cursor:pointer;transition:all .3s;white-space:nowrap;}
.btn-theme:hover{border-color:var(--c);background:var(--card-h);box-shadow:0 0 12px rgba(0,245,255,.15);transform:translateY(-1px);}
body.light .btn-theme{background:#f0f4ff;border-color:rgba(109,40,217,.2);}
body.light .btn-theme:hover{border-color:var(--v);background:#ede9ff;box-shadow:0 3px 12px rgba(109,40,217,.15);}
.ticon{font-size:.85rem;}
.mobile-btn{display:none;background:none;border:none;color:var(--c);font-size:1.8rem;cursor:pointer;}

/* ═══════════════════════════════════════
   PAGE
═══════════════════════════════════════ */
.page{position:relative;z-index:10;}
.wrap{max-width:1100px;margin:0 auto;padding:0 5%;}

/* ═══════════════════════════════════════
   HERO
═══════════════════════════════════════ */
.hero{padding:2.8rem 5% 1.8rem;text-align:center;animation:heroIn .9s ease both;}
@keyframes heroIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-family:'Orbitron',monospace;font-size:.62rem;letter-spacing:4px;color:var(--c);padding:6px 18px;border:1px solid var(--brd);border-radius:2px;background:var(--card);margin-bottom:1.2rem;animation:badgePulse 3s ease-in-out infinite;transition:all .4s;}
@keyframes badgePulse{0%,100%{box-shadow:none;}50%{box-shadow:0 0 16px rgba(0,245,255,.15);}}
body.light .hero-badge{color:var(--v);border-color:rgba(109,40,217,.25);background:#f0f4ff;}
.hero-badge::before{content:'▶';font-size:.5rem;}
.hero h1{font-family:'Orbitron',monospace;font-size:clamp(1.8rem,3.5vw,3rem);font-weight:900;line-height:1;margin-bottom:.6rem;}
.hero h1 .hl1{display:block;background:linear-gradient(135deg,#fff 0%,var(--c) 45%,var(--v) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
body.light .hero h1 .hl1{background:linear-gradient(135deg,#0f172a 0%,var(--v) 45%,var(--c) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero h1 .hl2{display:block;font-size:.42em;letter-spacing:8px;margin-top:.3rem;background:linear-gradient(135deg,var(--p),var(--v));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{max-width:560px;margin:0 auto;color:var(--mu);font-size:.92rem;line-height:1.8;font-weight:300;}

/* ═══════════════════════════════════════
   404
═══════════════════════════════════════ */
.e404{min-height:calc(100vh - 66px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 16px;}
.e404 h1 .hl1{font-size:clamp(5.5rem,18vw,11rem);line-height:.9;position:relative;}
.e404 h1 .hl2{letter-spacing:6px;}
.e404 p{margin-top:1rem;}
.e-wave{display:flex;align-items:center;justify-content:center;gap:4px;height:46px;margin:1.6rem 0 .4rem;}
.e-wave i{width:4px;border-radius:2px;background:linear-gradient(180deg,var(--c),var(--v));animation:eWave 1.4s ease-in-out infinite;}
@keyframes eWave{0%,100%{height:6px;opacity:.35;}50%{height:40px;opacity:1;}}
.e-wave.flat i{animation:none;height:3px;opacity:.4;}
.e-actions{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:1.8rem;}
.e-actions a,.e-actions button{display:inline-flex;align-items:center;padding:13px 24px;border-radius:8px;font-family:'Orbitron',monospace;font-size:.62rem;letter-spacing:2px;font-weight:700;text-decoration:none;cursor:pointer;transition:transform .2s,box-shadow .3s,border-color .2s;}
.e-go{border:none;background:linear-gradient(135deg,var(--v),var(--c));color:#fff;box-shadow:0 6px 22px rgba(124,58,237,.4);}
.e-alt{border:1.5px solid var(--brd);background:var(--card);color:var(--c);}
body.light .e-alt{color:var(--v);}
.e-actions a:hover,.e-actions button:hover{transform:translateY(-2px);}
.toast{position:fixed;left:50%;bottom:28px;z-index:300;transform:translate(-50%,20px);max-width:calc(100% - 32px);padding:.7rem 1.2rem;border-radius:10px;border:1px solid var(--brd);background:var(--nav-bg);color:var(--t);font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;}
.toast.show{opacity:1;transform:translate(-50%,0);}
@media(max-width:900px){
  .mobile-btn{display:block;}
  .nav-links{display:none;flex-direction:column;position:absolute;top:66px;left:0;width:100%;background:var(--nav-bg);padding:1.5rem 5%;border-bottom:1px solid var(--brd);gap:1rem;backdrop-filter:blur(28px);}
  .nav-links.open{display:flex;}
  .side,.corner{display:none;}
}

/* ═══════════════════════════════════════
   PERFORMANCE (LITE) MODE
═══════════════════════════════════════ */
body.lite #cv,body.lite .bg-scan,body.lite .ring,body.lite .aurora,body.lite .cursor-glow{display:none !important;}
body.lite .bg-photo,body.lite .bg-grid,body.lite .sline,body.lite .sdot,body.lite .corner,body.lite .dstrip,body.lite .logo,body.lite .hero-badge,body.lite .clock-pill,body.lite .h-line1,body.lite .hero h1 .hl1{animation:none !important;}
body.lite nav,body.lite .panel,body.lite .vc,body.lite .toolbar,body.lite .try,body.lite #np,body.lite .nav-links{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;}

/* ═══════════════════════════════════════
   ACCESSIBILITY + NAV TOOLS + INSTALL
═══════════════════════════════════════ */
.skip{position:fixed;left:16px;top:-60px;z-index:1000;padding:.7rem 1rem;border-radius:8px;background:var(--c);color:#020209;font-family:'Orbitron',monospace;font-size:.6rem;letter-spacing:2px;text-decoration:none;transition:top .2s;}
.skip:focus{top:12px;}
:focus-visible{outline:2px solid var(--c);outline-offset:3px;}
body.light :focus-visible{outline-color:var(--v);}
.nav-tools{display:flex;align-items:center;gap:.5rem;}
.install-chip{position:fixed;left:16px;bottom:16px;z-index:150;display:flex;align-items:center;border-radius:999px;border:1px solid var(--brd);background:var(--nav-bg);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.35);transform:translateY(160%);transition:transform .45s cubic-bezier(.34,1.56,.64,1);}
.install-chip.show{transform:none;}
.install-chip button{background:none;border:none;color:var(--t);cursor:pointer;font-family:'Orbitron',monospace;font-size:.55rem;letter-spacing:1.5px;padding:.8rem .5rem .8rem 1.1rem;}
.install-chip .ic-x{color:var(--mu);padding:.8rem 1.1rem .8rem .5rem;}
.install-chip .ic-go:hover{color:var(--c);}
@media(max-width:600px){#tlabel,#fx-label{display:none;}.btn-theme{padding:7px 11px;}}

/* Legible text on phones */
@media(max-width:600px){
  .vp-sub,.lang-meta,.take-text,.fx-d,.twin-d,.np-sub{font-size:12px;}
  .field-label,.btn-link,.sec-label,.save-details summary,.fields-row label,.ds-top,.prompt-top,.rec-status,.vc-spec,.vc-lab,.try-head,.sec-eye,.mq-hint{font-size:12px;letter-spacing:1.5px;}
}
</style>
</head>

<script>
/* THEME */
(function(){
  const body=document.body,btn=document.getElementById('theme-btn');
  const icon=document.getElementById('ticon'),label=document.getElementById('tlabel');
  let isLight=false;
  try{isLight=localStorage.getItem('resonance_theme')==='light';}catch(e){}
  function apply(l){isLight=l;if(l){body.classList.add('light');icon.textContent='☀️';label.textContent='LIGHT';}else{body.classList.remove('light');icon.textContent='🌙';label.textContent='DARK';}try{localStorage.setItem('resonance_theme',l?'light':'dark');}catch(e){}}
  apply(isLight);
  btn.addEventListener('click',function(){apply(!isLight);});
})();

/* MOBILE NAV */
document.getElementById('mob-btn').addEventListener('click',function(){document.getElementById('nav-links').classList.toggle('open');});

/* CANVAS-4FX */
(function(){
  const cv=document.getElementById('cv'),cx=cv.getContext('2d');
  let W,H,t=0;
  const CHARS='0123456789ABCDEFGHIJKLMNOP@#$%&*<>|~';
  let matCols=[];const matW=18;
  function initMatrix(){matCols=[];const count=Math.floor(W/matW);for(let i=0;i<count;i++){const chars=[];for(let j=0;j<16;j++)chars.push(CHARS[Math.floor(Math.random()*CHARS.length)]);matCols.push({y:Math.random()*H,speed:.4+Math.random()*1.2,chars:chars,len:4+Math.floor(Math.random()*8),active:Math.random()>.7});}}
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;initMatrix();}
  resize();window.addEventListener('resize',resize);
  let pts=[];
  function seedPts(){pts=[];const cols=['rgba(0,245,255,','rgba(124,58,237,','rgba(255,0,128,'];for(let i=0;i<Math.floor(W/13);i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*1.5+.4,col:cols[Math.floor(Math.random()*3)],a:Math.random()*.55+.1});}
  seedPts();
  const orbs=[];
  for(let i=0;i<6;i++)orbs.push({x:Math.random()*1400,y:Math.random()*900,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:60+Math.random()*90,hue:[180,270,320,200,280,160][i],phase:Math.random()*Math.PI*2,speed:.004+Math.random()*.006});
  function drawOrbs(){const il=document.body.classList.contains('light');orbs.forEach(function(o){o.x+=o.vx;o.y+=o.vy;o.phase+=o.speed;if(o.x<-o.r)o.x=W+o.r;if(o.x>W+o.r)o.x=-o.r;if(o.y<-o.r)o.y=H+o.r;if(o.y>H+o.r)o.y=-o.r;const pulse=(Math.sin(o.phase)+1)/2;const alpha=il?(.03+pulse*.04):(.06+pulse*.1);const hue=o.hue;const col=il?('hsla('+hue+',70%,45%,'):('hsla('+hue+',100%,60%,');const g=cx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);g.addColorStop(0,col+alpha+')');g.addColorStop(1,col+'0)');cx.beginPath();cx.arc(o.x,o.y,o.r,0,Math.PI*2);cx.fillStyle=g;cx.fill();});}
  const pings=[];
  function spawnPing(){pings.push({x:80+Math.random()*(W-160),y:80+Math.random()*(H-160),r:0,maxR:80+Math.random()*100,speed:.6+Math.random()*.5,col:['rgba(0,245,255,','rgba(124,58,237,','rgba(255,0,128,'][Math.floor(Math.random()*3)]});}
  spawnPing();spawnPing();setInterval(spawnPing,1800);
  function drawPings(){const il=document.body.classList.contains('light');for(let i=pings.length-1;i>=0;i--){const p=pings[i];p.r+=p.speed;const prog=p.r/p.maxR,al=il?(1-prog)*.12:(1-prog)*.22;const lc=p.col.replace('rgba(0,245,255,','rgba(2,132,199,').replace('rgba(124,58,237,','rgba(109,40,217,').replace('rgba(255,0,128,','rgba(219,39,119,');const col=il?lc:p.col;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.strokeStyle=col+al+')';cx.lineWidth=1.5;cx.stroke();if(p.r>12){cx.beginPath();cx.arc(p.x,p.y,p.r*.55,0,Math.PI*2);cx.strokeStyle=col+(al*.5)+')';cx.lineWidth=.8;cx.stroke();}if(p.r<20){cx.beginPath();cx.arc(p.x,p.y,2.5,0,Math.PI*2);cx.fillStyle=col+(il?.4:.6)+')';cx.fill();}if(p.r>=p.maxR)pings.splice(i,1);}}
  initMatrix();let matTick=0;
  function drawMatrix(){const il=document.body.classList.contains('light');matTick++;if(matTick%8===0)matCols.forEach(function(c){if(Math.random()<.3)c.chars[Math.floor(Math.random()*c.chars.length)]=CHARS[Math.floor(Math.random()*CHARS.length)];});if(matTick%60===0)matCols.forEach(function(c){c.active=Math.random()>.65;});cx.font='11px monospace';matCols.forEach(function(c,i){if(!c.active)return;c.y+=c.speed;if(c.y>H+c.len*14)c.y=-c.len*14;for(let j=0;j<c.len;j++){const y=c.y-j*14;if(y<0||y>H)continue;const x=i*matW;if(x>W*.14&&x<W*.86)continue;const al=il?(j===0?.18:Math.max(0,.12-j*.015)):(j===0?.55:Math.max(0,.4-j*.05));cx.fillStyle=j===0?(il?'rgba(109,40,217,'+al+')':'rgba(0,245,255,'+al+')'):(il?'rgba(109,40,217,'+(al*.5)+')':'rgba(0,245,255,'+(al*.5)+')');cx.fillText(c.chars[j%c.chars.length],x,y);}});}
  function drawDNA(){const il=document.body.classList.contains('light');const c1=il?'rgba(109,40,217,':'rgba(0,245,255,',c2=il?'rgba(219,39,119,':'rgba(124,58,237,';const sp=18,amp=14,rows=Math.ceil(H/sp)+2;[0,W].forEach(function(side){for(let i=0;i<rows;i++){const y=(i*sp-(t*.6)%sp)-sp;const bx=side===0?22:W-22;const x1=bx+Math.sin(i*.45+t*.025)*amp;const x2=bx-Math.sin(i*.45+t*.025)*amp;cx.beginPath();cx.arc(x1,y,2.2,0,Math.PI*2);cx.fillStyle=c1+(il?.35:.55)+')';cx.fill();cx.beginPath();cx.arc(x2,y,2.2,0,Math.PI*2);cx.fillStyle=c2+(il?.35:.55)+')';cx.fill();if(i%2===0){const g=cx.createLinearGradient(x2,y,x1,y);g.addColorStop(0,c2+(il?.2:.3)+')');g.addColorStop(1,c1+(il?.2:.3)+')');cx.beginPath();cx.moveTo(x2,y);cx.lineTo(x1,y);cx.strokeStyle=g;cx.lineWidth=1;cx.stroke();}}});}
  function draw(){if(document.body.classList.contains('lite')){cx.clearRect(0,0,W,H);setTimeout(function(){requestAnimationFrame(draw);},500);return;}cx.clearRect(0,0,W,H);t++;const il=document.body.classList.contains('light');drawOrbs();for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<130){cx.beginPath();cx.strokeStyle=il?'rgba(109,40,217,'+(.06*(1-d/130))+')':'rgba(0,245,255,'+(.1*(1-d/130))+')';cx.lineWidth=.5;cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.stroke();}}pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;const col=il?p.col.replace('rgba(0,245,255,','rgba(2,132,199,').replace('rgba(124,58,237,','rgba(109,40,217,').replace('rgba(255,0,128,','rgba(219,39,119,'):p.col;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle=col+(il?p.a*.5:p.a)+')';cx.fill();});drawDNA();drawPings();drawMatrix();requestAnimationFrame(draw);}
  draw();
})();

/* ── SITE: performance mode, install app, accessibility ── */
(function(){
  const body=document.body,KEY='resonance_fx';
  const say=typeof toast==='function'?toast:function(m){const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2600);};
  const btn=document.getElementById('fx-btn'),icon=document.getElementById('fx-icon'),label=document.getElementById('fx-label');
  let pref='auto',slow=false;
  try{pref=localStorage.getItem(KEY)||'auto';slow=sessionStorage.getItem('resonance_slow')==='1';}catch(e){}

  /* Lite by default on reduced-motion, data-saver or low-power devices */
  function autoLite(){
    const mm=function(q){return !!(window.matchMedia&&matchMedia(q).matches);},c=navigator.connection;
    return mm('(prefers-reduced-motion: reduce)')||!!(c&&c.saveData)||(navigator.hardwareConcurrency>0&&navigator.hardwareConcurrency<=4)||(navigator.deviceMemory>0&&navigator.deviceMemory<=4);
  }
  function apply(){
    const lite=pref==='lite'||(pref==='auto'&&(slow||autoLite()));
    body.classList.toggle('lite',lite);
    if(btn){
      icon.textContent=lite?'⚡':'✨';label.textContent=lite?'LITE':'FX';
      btn.setAttribute('aria-pressed',String(!lite));
      btn.title=(lite?'Lite effects':'Full effects')+(pref==='auto'?' (automatic)':'')+'. Click to switch.';
    }
  }
  apply();
  if(btn)btn.addEventListener('click',function(){
    pref=body.classList.contains('lite')?'full':'lite';
    try{localStorage.setItem(KEY,pref);}catch(e){}
    apply();
    say(pref==='lite'?'⚡ Lite effects: smoother and easier on your battery':'✨ Full effects on');
  });

  /* Watch the frame rate for a few seconds and drop to lite if the device struggles */
  if(pref==='auto'&&!body.classList.contains('lite')){
    const times=[];let last=0,start=0;
    const tick=function(now){
      if(document.hidden){last=0;requestAnimationFrame(tick);return;}
      if(!start)start=now;
      if(last)times.push(now-last);
      last=now;
      if(now-start<6000){requestAnimationFrame(tick);return;}
      times.sort(function(a,b){return a-b;});
      if((times[Math.floor(times.length/2)]||16)>30){
        slow=true;try{sessionStorage.setItem('resonance_slow','1');}catch(e){}
        apply();say('⚡ Switched to lite effects for smoother performance');
      }
    };
    setTimeout(function(){requestAnimationFrame(tick);},1500);
  }

  /* Menu button state for screen readers */
  const mob=document.getElementById('mob-btn'),links=document.getElementById('nav-links');
  if(mob&&links)mob.addEventListener('click',function(){mob.setAttribute('aria-expanded',String(links.classList.contains('open')));});

  /* Anonymous page-view counter (shown in the owner's dashboard) */
  window.rsTrack=function(ev){
    if(!/^https?:$/.test(location.protocol))return;
    try{fetch('/api/track',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(ev),keepalive:true}).catch(function(){});}catch(e){}
  };
  if(['/','/index.html','/services.html','/contact.html','/clone.html','/index','/services','/contact','/clone'].indexOf(location.pathname)>-1)rsTrack({type:'view',page:location.pathname});

  /* Offline support */
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){});});
  }

  /* Install-app button (browsers that support it) */
  let deferred=null;
  addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();deferred=e;
    try{if(localStorage.getItem('resonance_install_dismissed'))return;}catch(err){}
    if(document.getElementById('install-chip'))return;
    const chip=document.createElement('div');chip.className='install-chip';chip.id='install-chip';
    chip.innerHTML='<button type="button" class="ic-go">📲 INSTALL RESONANCE</button><button type="button" class="ic-x" aria-label="Dismiss install suggestion">✕</button>';
    body.appendChild(chip);
    setTimeout(function(){chip.classList.add('show');},800);
    chip.querySelector('.ic-go').addEventListener('click',function(){
      chip.remove();if(!deferred)return;
      deferred.prompt();deferred.userChoice.then(function(){deferred=null;});
    });
    chip.querySelector('.ic-x').addEventListener('click',function(){chip.remove();try{localStorage.setItem('resonance_install_dismissed','1');}catch(err){}});
  });
  addEventListener('appinstalled',function(){const c=document.getElementById('install-chip');if(c)c.remove();say('📲 Resonance installed! Find it on your home screen.');});
})();
</script>
