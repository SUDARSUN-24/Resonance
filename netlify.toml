# Netlify settings for RESONANCE (static site + serverless backend)

# Run the tests before every deploy. If any test fails, the deploy stops
# and the live site stays on the last working version.
[build]
  command = "npm test"
  publish = "."

[build.environment]
  NODE_VERSION = "26"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The service worker must never be cached, so new versions roll out immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Voice Lab: cross-origin isolation lets the HD voice use several CPU cores (about 1.6x faster).
# "credentialless" still lets Google Fonts and Unsplash load; browsers that don't know it ignore it.
[[headers]]
  for = "/contact.html"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/contact"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/hd-worker.js"
  [headers.values]
    Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # Other websites can't show these pages inside a frame (stops click-tricks)
    Content-Security-Policy = "frame-ancestors 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

# Owner dashboard: never framed by anyone, never cached.
# Keep this after "/*" above: when two rules set the same header, Netlify uses the later one.
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    Cache-Control = "no-store"

# Netlify can't run PHP, so it would serve these files as plain text.
# Hide them (the backend only works on a PHP host such as XAMPP).
[[redirects]]
  from = "/admin.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/db.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/save_request.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/setup_db.sql"
  to = "/404.html"
  status = 404
  force = true

# The Learn Thai page was removed; Thai phrase practice lives on the Play page
[[redirects]]
  from = "/learn.html"
  to = "/play.html"
  status = 301

[[redirects]]
  from = "/learn"
  to = "/play.html"
  status = 301
