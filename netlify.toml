# Netlify settings for RESONANCE (static site + serverless backend)

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Owner dashboard: never framed by other sites, never cached
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

# The service worker must never be cached, so new versions roll out immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

# Netlify can't run PHP, so it would serve these files as plain text.
# Hide them (the backend only works on a PHP host such as XAMPP).
[[redirects]]
  from = "/admin.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/db.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/save_request.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/setup_db.sql"
  to = "/404.html"
  status = 404
  force = true
